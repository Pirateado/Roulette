<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruleta - Estadísticas</title>
<style>
:root{--bg:#0f1a14;--card:#16261d;--tx:#e8efe9;--mut:#8fa396;--red:#c62828;--blk:#1c1c1c;--grn:#1b7a3d;--acc:#f2c94c;--bd:#2a4034}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);padding:16px}
h1{font-size:20px;margin:0 0 12px}
h2{font-size:14px;margin:0 0 8px;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.wrap{display:grid;grid-template-columns:minmax(300px,480px) 1fr;gap:14px;max-width:1200px;margin:auto}
@media(max-width:850px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:14px}
.pad{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.pad button,.chip{border:0;border-radius:6px;color:#fff;font-weight:700;cursor:pointer}
.pad button{padding:9px 0;font-size:14px}
.pad .z{grid-column:1/-1;background:var(--grn)}
.r{background:var(--red)}.b{background:var(--blk);outline:1px solid #444}.g{background:var(--grn)}
.pad button:active{transform:scale(.93)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
input,select,button.t{background:#0c1510;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font-size:14px}
button.t{cursor:pointer}button.t:hover{border-color:var(--acc)}
#hist{display:flex;flex-wrap:wrap;gap:4px;max-height:150px;overflow:auto}
.chip{padding:4px 8px;font-size:13px;cursor:default}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:5px 6px;text-align:left;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-weight:600}
.bar{height:8px;background:#0c1510;border-radius:4px;position:relative;min-width:80px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--acc)}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.7}
.pos{color:#6fe39a}.neg{color:#ff8a80}
.best{font-size:18px;font-weight:700;color:var(--acc)}
.note{color:var(--mut);font-size:12px;line-height:1.5}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#0c1510;border:1px solid var(--bd)}
</style>
</head>
<body>
<h1>🎰 Ruleta · Historial y estadísticas</h1>
<div class="wrap">
  <div>
    <div class="card">
      <h2>Agregar resultado</h2>
      <div class="pad" id="pad"></div>
      <div class="row">
        <input id="num" type="number" min="0" max="36" placeholder="Número (0-36) + Enter" style="width:190px">
        <button class="t" id="undo">↩ Deshacer</button>
        <button class="t" id="clear">🗑 Borrar todo</button>
      </div>
    </div>
    <div class="card">
      <h2>Historial (<span id="cnt">0</span>)</h2>
      <div id="hist"></div>
      <div class="row">
        <label class="note">Analizar:
          <select id="win">
            <option value="0">Todas las tiradas</option>
            <option value="30">Últimas 30</option>
            <option value="50">Últimas 50</option>
            <option value="100">Últimas 100</option>
            <option value="200">Últimas 200</option>
          </select>
        </label>
        <button class="t" id="exp">Exportar</button>
        <button class="t" id="imp">Importar</button>
      </div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>Mejor apuesta según los datos</h2>
      <div id="best" class="best">—</div>
      <div id="bestsub" class="note"></div>
      <div class="row"><span class="pill" id="chi">χ²: —</span><span class="pill" id="fair">—</span></div>
      <p class="note" id="warn"></p>
    </div>
    <div class="card">
      <h2>Apuestas externas</h2>
      <table id="tbl"></table>
    </div>
    <div class="card">
      <h2>Números</h2>
      <div class="note" style="margin-bottom:6px">🔥 Más salidos / ❄️ menos salidos</div>
      <div class="row" style="margin:0 0 8px"><b>🔥</b><span id="hot"></span></div>
      <div class="row" style="margin:0"><b>❄️</b><span id="cold"></span></div>
      <div class="row"><button class="t" id="toggleAll">Ver los 37 números</button></div>
      <table id="all" style="display:none;margin-top:8px"></table>
    </div>
  </div>
</div>

<script>
const REDS=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const color=n=>n===0?'g':REDS.has(n)?'r':'b';
const BETS=[
 ['🔴 Rojo',n=>REDS.has(n),18],['⚫ Negro',n=>n>0&&!REDS.has(n),18],
 ['Par',n=>n>0&&n%2===0,18],['Impar',n=>n%2===1,18],
 ['1-18',n=>n>=1&&n<=18,18],['19-36',n=>n>=19,18],
 ['1ª docena (1-12)',n=>n>=1&&n<=12,12],['2ª docena (13-24)',n=>n>=13&&n<=24,12],['3ª docena (25-36)',n=>n>=25,12],
 ['Columna 1 (1,4,7…)',n=>n>0&&n%3===1,12],['Columna 2 (2,5,8…)',n=>n>0&&n%3===2,12],['Columna 3 (3,6,9…)',n=>n>0&&n%3===0,12],
 ['Cero (0)',n=>n===0,1]
];
let hist=[];
try{hist=JSON.parse(localStorage.getItem('ruleta_hist')||'[]')}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem('ruleta_hist',JSON.stringify(hist))}catch(e){}};

// p-valor chi-cuadrado (gamma incompleta)
function lg(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const k of c)s+=k/++y;return -t+Math.log(2.5066282746310005*s/x)}
function gq(a,x){if(x<=0)return 1;if(x<a+1){let ap=a,s=1/a,d=s;for(let i=0;i<500;i++){ap++;d*=x/ap;s+=d;if(Math.abs(d)<Math.abs(s)*1e-12)break}return 1-s*Math.exp(-x+a*Math.log(x)-lg(a))}
 let b=x+1-a,c=1e300,d=1/b,h=d;for(let i=1;i<500;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-12)break}
 return Math.exp(-x+a*Math.log(x)-lg(a))*h}

function add(n){if(n>=0&&n<=36&&Number.isInteger(n)){hist.push(n);save();render()}}
function chipHTML(n){return `<span class="chip ${color(n)}">${n}</span>`}

function render(){
  // pad
  $('cnt').textContent=hist.length;
  $('hist').innerHTML=hist.slice().reverse().map(chipHTML).join('')||'<span class="note">Sin datos aún. Toca un número para empezar.</span>';
  const w=+$('win').value;
  const data=w?hist.slice(-w):hist;
  const n=data.length;
  const counts=Array(37).fill(0);data.forEach(x=>counts[x]++);

  // apuestas externas
  const rows=BETS.map(([name,fn,k])=>{
    const p=k/37;let o=0;for(let i=0;i<37;i++)if(fn(i))o+=counts[i];
    const exp=n*p,sd=Math.sqrt(n*p*(1-p)),z=sd?(o-exp)/sd:0;
    return {name,o,pct:n?o/n*100:0,ep:p*100,z,k};
  });
  $('tbl').innerHTML='<tr><th>Apuesta</th><th>Salió</th><th>%</th><th>Esperado</th><th>Dif.</th><th></th></tr>'+rows.map(r=>{
    const d=r.pct-r.ep,cl=d>0?'pos':'neg';
    return `<tr><td>${r.name}</td><td>${r.o}</td><td>${r.pct.toFixed(1)}%</td><td>${r.ep.toFixed(1)}%</td>
    <td class="${cl}">${d>=0?'+':''}${d.toFixed(1)}</td>
    <td><div class="bar"><i style="width:${Math.min(100,r.pct/ (r.ep*2||1)*50)}%"></i><u style="left:50%"></u></div></td></tr>`}).join('');

  // mejor apuesta
  if(n<10){$('best').textContent='Necesito al menos 10 tiradas';$('bestsub').textContent='';}
  else{
    const cand=rows.filter(r=>r.k>1).sort((a,b)=>b.z-a.z)[0];
    $('best').textContent=`${cand.name} — ${cand.pct.toFixed(1)}% (esperado ${cand.ep.toFixed(1)}%)`;
    $('bestsub').textContent=`Salió ${cand.o} de ${n} veces · desviación z = ${cand.z.toFixed(2)} (|z|>2 empieza a ser llamativo)`;
  }

  // chi-cuadrado
  if(n>0){
    let chi=0;const e=n/37;counts.forEach(c=>chi+=(c-e)**2/e);
    const p=gq(18,chi/2);
    $('chi').textContent=`χ² = ${chi.toFixed(1)} · p = ${p.toFixed(3)}`;
    const f=$('fair');
    if(n<185){f.textContent='Pocos datos para concluir';}
    else if(p<0.01){f.textContent='⚠️ Sesgo muy probable';}
    else if(p<0.05){f.textContent='Posible sesgo (a confirmar)';}
    else{f.textContent='Parece uniforme (sin sesgo claro)';}
    $('warn').textContent=n<185?`Para detectar un sesgo real hacen falta unas 200+ tiradas (llevas ${n}). Con pocas tiradas, lo que ves es casi seguro azar.`:
      'Si p > 0.05, la ruleta se comporta como aleatoria y ninguna apuesta tiene ventaja. Si p es muy bajo de forma sostenida, el juego podría tener sesgo y la apuesta destacada tendría sentido.';
  }else{$('chi').textContent='χ²: —';$('fair').textContent='—';$('warn').textContent='';}

  // números
  const order=[...Array(37).keys()].sort((a,b)=>counts[b]-counts[a]||a-b);
  const fmt=i=>`<span class="chip ${color(i)}">${i}</span> <span class="note">${counts[i]}×</span> `;
  $('hot').innerHTML=order.slice(0,5).map(fmt).join('');
  $('cold').innerHTML=order.slice(-5).reverse().map(fmt).join('');
  $('all').innerHTML='<tr><th>N°</th><th>Veces</th><th>%</th></tr>'+order.map(i=>`<tr><td>${chipHTML(i)}</td><td>${counts[i]}</td><td>${n?(counts[i]/n*100).toFixed(1):0}% <span class="note">(esp. 2.7%)</span></td></tr>`).join('');
}

// init pad
$('pad').innerHTML='<button class="z g" data-n="0">0</button>'+[...Array(36).keys()].map(i=>`<button class="${color(i+1)}" data-n="${i+1}">${i+1}</button>`).join('');
$('pad').onclick=e=>{const b=e.target.closest('button');if(b)add(+b.dataset.n)};
$('num').onkeydown=e=>{if(e.key==='Enter'&&e.target.value!==''){add(+e.target.value);e.target.value=''}};
$('undo').onclick=()=>{hist.pop();save();render()};
$('clear').onclick=()=>{if(confirm('¿Borrar todo el historial?')){hist=[];save();render()}};
$('win').onchange=render;
$('toggleAll').onclick=()=>{const t=$('all');t.style.display=t.style.display==='none'?'table':'none'};
$('exp').onclick=()=>prompt('Copia tu historial:',hist.join(','));
$('imp').onclick=()=>{const s=prompt('Pega números separados por coma o espacio:');if(s===null)return;
  const a=s.split(/[\s,;]+/).filter(x=>x!=='').map(Number).filter(x=>Number.isInteger(x)&&x>=0&&x<=36);hist=hist.concat(a);save();render()};
render();
</script>
</body>
</html>
